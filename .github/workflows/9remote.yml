name: 9Remote Tunnel Runner

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration to keep runner alive in hours (1-24)'
        required: true
        default: '6'
        type: string
      auto_approve:
        description: 'Auto-approve new incoming device connections'
        required: true
        default: true
        type: boolean

jobs:
  run-9remote:
    name: Run 9Remote Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y jq build-essential libsqlite3-dev python3 make g++ curl

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo -S -p '' apt install -y /tmp/cloudflared.deb
          rm /tmp/cloudflared.deb

      - name: Set script permissions
        run: chmod +x scripts/run-9remote-fixed.sh

      - name: Run 9Remote Service
        run: |
          ./scripts/run-9remote-fixed.sh "${{ inputs.duration }}" "${{ inputs.auto_approve }}"
